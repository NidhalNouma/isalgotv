{% load compress %} {% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" class="max-w-screen overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    {% block title %}
      <title>Tero</title>
    {% endblock %}
    {% block description %}
      <meta name="description" content="Let AI trade for you!" />
    {% endblock %}

    <!-- This is for search engines and won't affect the actual URL directly, but it's a good practice to ensure your slug is reflected in the URL structure managed by your server or CMS -->
    <link rel="icon" href="{% static 'images/logo.png' %}" type="image/x-icon" />
    <link rel="icon" sizes="16x16" href="{% static 'images/logo_img_16_16.png' %}" />
    <link rel="icon" sizes="32x32" href="{% static 'images/logo_img_32_32.png' %}" />
    <link rel="icon" sizes="48x48" href="{% static 'images/logo_img_48_48.png' %}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/logo_img_180_180.png' %}" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-TileImage" content="{% static 'images/seo-meta-img.png' %}" />

    <!-- Open Graph / Facebook meta tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tero" />
    <meta property="og:description" content="Let AI trade for you!" />
    <meta property="og:url" content="https://tero.isalgo.com/" />
    <meta name="og:image" content="{% static 'images/seo-meta-img.png' %}" />

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tero" />
    <meta name="twitter:description" content="Let AI trade for you!" />
    <meta name="twitter:url" content="https://tero.isalgo.com/" />
    <meta name="twitter:image" content="{% static 'images/seo-meta-img.png' %}" />


    <link rel="preload" href="{% static 'fonts/Assistant-VariableFont_wght.ttf' %}" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="{% static 'fonts/AzeretMono-VariableFont_wght.ttf' %}" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="{% static 'fonts/AzeretMono-Italic-VariableFont_wght.ttf' %}" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="{% static 'fonts/Commissioner-VariableFont_wght.ttf' %}" as="font" type="font/ttf" crossorigin />

    {% compress css %}
    <link rel="stylesheet" href="{% static 'src/output.css' %}" />
    {% endcompress %}

    <script type="text/javascript">
      // Load theme
      if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>

    {% block head %}

    {% endblock %}
  </head>

  <body class="bg-background flex flex-col relative max-w-full mx-auto overflow-x-clip">
    {% block body %}

    {% endblock %}
  </body>
</html>
